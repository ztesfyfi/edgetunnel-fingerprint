name: Build and sync single Worker

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  build-single-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch upstream core and build one-file Worker
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch --depth=1 upstream main
          git show upstream/main:_worker.js > /tmp/edgetunnel-upstream-core.js
          node scripts/build-single-worker.mjs /tmp/edgetunnel-upstream-core.js
          node --check _worker.js
      - name: Commit generated Worker if changed
        run: |
          set -euo pipefail
          git config user.name "GH Action - Single Worker Builder"
          git config user.email "action@github.com"
          if git diff --quiet -- _worker.js; then
            echo "Single-file Worker is already current."
            exit 0
          fi
          git add _worker.js
          git commit -m "chore: rebuild single-file Worker from upstream"
          git push origin main
