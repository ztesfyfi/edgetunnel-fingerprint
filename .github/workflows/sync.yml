name: Upstream Core Sync

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync.yml"
      - "_worker.js"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  sync-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Sync upstream Worker core only
        run: |
          set -euo pipefail
          git config user.name "GH Action - Upstream Core Sync"
          git config user.email "action@github.com"
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main
          git show upstream/main:_worker.js > _worker-core.js
          node --check _worker-core.js
          if [ -z "$(git status --porcelain -- _worker-core.js)" ]; then
            echo "Upstream core is already current."
            exit 0
          fi
          git add _worker-core.js
          git commit -m "chore: sync upstream Worker core"
          git push origin main
