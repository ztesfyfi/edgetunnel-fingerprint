name: Validate Worker sources

on:
  push:
    branches: [main]
    paths:
      - "_worker.js"
      - "_worker-core.js"
  pull_request:
    paths:
      - "_worker.js"
      - "_worker-core.js"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check _worker.js
          if [ -f _worker-core.js ]; then
            node --check _worker-core.js
          else
            echo "Core not synced yet; run Upstream Core Sync before deployment."
          fi
